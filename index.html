<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Maize & Potato Leaf Care Advisor</title>
  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --primary: #2e7d32;
      --primary-hover: #1b5e20;
      --text: #333333;
      --border: #e0e0e0;
      --warning-bg: #fff3cd;
      --warning-text: #856404;
      --error-bg: #f8d7da;
      --error-text: #721c24;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      color: var(--primary);
      margin-bottom: 8px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
    }

    input[type="text"], input[type="file"] {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      box-sizing: border-box;
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
    }

    button:disabled {
      background-color: #a5d6a7;
      cursor: not-allowed;
    }

    .preview-container {
      text-align: center;
      margin-top: 15px;
    }

    .preview-container img {
      max-width: 100%;
      max-height: 300px;
      border-radius: 6px;
      display: none;
    }

    .results {
      display: none;
    }

    .alert {
      padding: 12px 16px;
      background-color: var(--warning-bg);
      color: var(--warning-text);
      border-radius: 6px;
      font-weight: 500;
      margin-bottom: 16px;
    }

    .error-box {
      display: none;
      padding: 12px 16px;
      background-color: var(--error-bg);
      color: var(--error-text);
      border-radius: 6px;
      margin-top: 15px;
      word-break: break-all;
    }

    .output-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    @media (min-width: 600px) {
      .output-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .result-box {
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 6px;
      background: #fafafa;
    }

    .result-box h3 {
      margin-top: 0;
      font-size: 14px;
      color: #666;
      text-transform: uppercase;
    }

    .result-value {
      font-size: 18px;
      font-weight: bold;
      color: var(--primary);
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Maize & Potato Leaf Care Advisor</h1>
  </header>

  <div class="card">
    <div class="form-group">
      <label for="apiKey">Roboflow API Key</label>
      <input type="text" id="apiKey" placeholder="Paste your API Key here" />
    </div>

    <div class="form-group">
      <label for="leafImage">Select Leaf Image</label>
      <input type="file" id="leafImage" accept="image/*" />
    </div>

    <div class="preview-container">
      <img id="imagePreview" alt="Leaf Preview" />
    </div>

    <button id="analyzeBtn" style="margin-top: 15px;">Analyze Leaf</button>
    <div id="errorBox" class="error-box"></div>
  </div>

  <div id="resultsCard" class="card results">
    <h2>Analysis Results</h2>

    <div class="alert">
      ⚠️ <strong>Unverified Diagnosis Notice:</strong> Model predictions are preliminary visual outputs.
    </div>

    <div class="output-grid">
      <div class="result-box">
        <h3>Main Prediction</h3>
        <div id="mainPrediction" class="result-value">-</div>
      </div>
      <div class="result-box">
        <h3>Public Corn Model</h3>
        <div id="publicPrediction" class="result-value">-</div>
      </div>
      <div class="result-box">
        <h3>Common Rust Model</h3>
        <div id="rustPrediction" class="result-value">-</div>
      </div>
      <div class="result-box">
        <h3>Damage Severity</h3>
        <div id="damageRating" class="result-value">-</div>
      </div>
    </div>
  </div>
</div>

<script>
  // Roboflow Serverless Endpoint
  const WORKFLOW_URL = "https://serverless.roboflow.com/anesu-lincoln-gideon-magumbe/maize-and-potato-leaf-care-advisor-1791008570420";

  const leafInput = document.getElementById('leafImage');
  const imagePreview = document.getElementById('imagePreview');
  const analyzeBtn = document.getElementById('analyzeBtn');
  const resultsCard = document.getElementById('resultsCard');
  const errorBox = document.getElementById('errorBox');

  let base64Image = "";

  leafInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(evt) {
        imagePreview.src = evt.target.result;
        imagePreview.style.display = 'inline-block';
        base64Image = evt.target.result.split(',')[1];
      };
      reader.readAsDataURL(file);
    }
  });

  analyzeBtn.addEventListener('click', async () => {
    const apiKey = document.getElementById('apiKey').value.trim();
    errorBox.style.display = 'none';

    if (!apiKey) {
      showError("Please enter your Roboflow API key.");
      return;
    }
    if (!base64Image) {
      showError("Please select an image file first.");
      return;
    }

    analyzeBtn.disabled = true;
    analyzeBtn.innerText = "Analyzing...";

    try {
      const response = await fetch(`${WORKFLOW_URL}?api_key=${apiKey}`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          inputs: {
            image: { type: "base64", value: base64Image }
          }
        })
      });

      const responseData = await response.json();

      if (!response.ok) {
        throw new Error(responseData.message || `Server responded with status ${response.status}`);
      }

      displayResults(responseData);
    } catch (err) {
      console.error("Workflow Error:", err);
      showError(`Connection Error: ${err.message}. If opening directly as a file, run via a local server (e.g. python -m http.server).`);
    } finally {
      analyzeBtn.disabled = false;
      analyzeBtn.innerText = "Analyze Leaf";
    }
  });

  function showError(msg) {
    errorBox.innerText = msg;
    errorBox.style.display = 'block';
  }

  function displayResults(data) {
    resultsCard.style.display = 'block';
    const res = Array.isArray(data) ? data[0] : data;

    document.getElementById('mainPrediction').innerText = parsePrediction(res.predictions);
    document.getElementById('publicPrediction').innerText = parsePrediction(res.maize_dataset_model_predictions);
    document.getElementById('rustPrediction').innerText = parsePrediction(res.common_rust_model_predictions);
    document.getElementById('damageRating').innerText = parsePrediction(res.damage_rating_predictions) || "N/A";
  }

  function parsePrediction(predObj) {
    if (!predObj) return "N/A";
    if (predObj.predictions && predObj.predictions.length > 0) {
      const top = predObj.predictions[0];
      return `${top.class || top.label || 'Detected'} (${(top.confidence * 100).toFixed(1)}%)`;
    }
    return "N/A";
  }
</script>
</body>
</html>
